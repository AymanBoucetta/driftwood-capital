[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
exclude-newer = "2026-09-22T00:00:00Z"
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.13.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-ai==2.43.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.53.0",
]


[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"


[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
]
[tool.hatch.build.targets.wheel]
packages = ["app"]